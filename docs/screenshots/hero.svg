<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="55%" stop-color="#0b0817"/>
      <stop offset="100%" stop-color="#120a26"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="infinityStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- marco fino -->
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- símbolo infinito -->
  <g transform="translate(210,170)" filter="url(#softGlow)">
    <path d="M -46 0
             C -46 -26, -20 -26, 0 0
             C 20 26, 46 26, 46 0
             C 46 -26, 20 -26, 0 0
             C -20 26, -46 26, -46 0 Z"
          fill="none" stroke="url(#infinityStroke)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#wordmark)" letter-spacing="-1.5">FreeRoute</text>

  <!-- tagline -->
  <text x="302" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">Your AI coding tool never sees a rate limit again.</text>

  <!-- divisor -->
  <line x1="302" y1="222" x2="900" y2="222" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- pills -->
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#c4b5fd">
    <rect x="302" y="240" width="146" height="30" rx="15" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="322" y="260">14 providers</text>

    <rect x="460" y="240" width="196" height="30" rx="15" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="480" y="260">automatic fallback</text>

    <rect x="668" y="240" width="150" height="30" rx="15" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="688" y="260">keyless-first</text>

    <rect x="830" y="240" width="150" height="30" rx="15" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="850" y="260">zero config</text>
  </g>
</svg>
